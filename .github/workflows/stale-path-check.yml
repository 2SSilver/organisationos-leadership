name: stale-path-check

# Calls Foundation's stale-path-check reusable (AR-05 regression guard).
# Rejects the monorepo-era `foundation/<path>` prefix and the bare
# `../foundation|leadership|domain/` sibling forms. Note the depth rule: files
# one level in (cadence/…, steward/…) need ../../organisationos-<repo>/.

on:
  pull_request:

jobs:
  call:
    uses: <adopter-org>/organisationos-foundation/.github/workflows/stale-path-check.yml@v1  # pin to a released tag or commit SHA; bump via a two-approver Foundation PR that also rolls the tag
